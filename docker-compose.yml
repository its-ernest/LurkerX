services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - BASE_DIR=/app
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-fantastic_lurkerx_key_2024}
      - TOKEN_SERVER_URL=http://validator:8080
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  validator:
    build:
      context: ./validator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PAYSTACK_SECRET_KEY=sk_test_f60d395afd14fb86f9a599220be875aacc72c261
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - FRONTEND_DIR=./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
